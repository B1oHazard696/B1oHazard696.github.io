<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Медиаданные не найдены · Геннадий Андреев</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/media/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&family=Nunito:wght@500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#111215;color:#fff;font:500 15px/1.5 Nunito,system-ui,sans-serif;display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mon{width:min(100%,880px);background:#1b1c20;border:1px solid #2d2f35;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.tab{padding:10px 18px;border-bottom:1px solid #2d2f35;font-size:12px;color:#d9dbe1}
.tab b{font-weight:500;border-bottom:3px solid #3d8bfd;padding-bottom:7px}
.scr{margin:14px;aspect-ratio:16/9;border-radius:12px;background:#a3161c;display:grid;place-items:center;text-align:center;padding:24px}
.scr h1{margin:0;font:600 clamp(20px,4vw,34px)/1.15 Unbounded,system-ui,sans-serif}
.scr p{margin:10px 0 0;font:500 12px 'JetBrains Mono',monospace;opacity:.85;overflow-wrap:anywhere}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:0 14px 14px}
.tc{font:500 18px 'JetBrains Mono',monospace;color:#5fb0ff}
a.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:#3d8bfd;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
a.btn:hover{filter:brightness(1.1)}
a.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main class="mon">
  <div class="tab"><b id="tab">Программа: 404.mp4</b></div>
  <div class="scr"><div><h1 id="h">Медиаданные в автономном режиме</h1><p id="p"></p></div></div>
  <div class="bar"><span class="tc">00:00:04:04</span><a class="btn" href="/" id="b">← Вернуться к проекту</a></div>
</main>
<script>
document.getElementById("p").textContent = "Файл не найден: " + decodeURIComponent(location.pathname);
if (!/^ru|^uk|^be|^kk/i.test(navigator.language || "")) {
  document.documentElement.lang = "en"; document.title = "Media not found · Gennady Andreev";
  document.getElementById("h").textContent = "Media offline";
  document.getElementById("p").textContent = "File not found: " + decodeURIComponent(location.pathname);
  document.getElementById("b").textContent = "← Back to the project"; document.getElementById("b").href = "/#en";
}
</script>
</body>
</html>
